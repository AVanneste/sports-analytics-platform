name: Daily Sports Data Sync, Auto-Reconciliation & Model Retraining

on:
  schedule:
    # Backup trigger. GitHub starts scheduled runs hours late (3-7 h in Sept/Oct 2026) and drops
    # some, so the daily run is normally triggered at an exact time by an external scheduler
    # (cron-job.org calling the workflow_dispatch API); this fires only if that did not happen.
    - cron: '37 0 * * *'
  workflow_dispatch: # manual "Run workflow" button and the external scheduler
    inputs:
      force:
        description: "Run even if today's run already succeeded"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Two triggers on the same day queue up instead of running side by side
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  check-today:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - name: 🔎 Skip if today's run already succeeded
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily_update.yml --status success \
                --created ">=$(date -u +%F)" --json databaseId --jq length 2>/dev/null || echo 0)
          echo "Successful runs today (UTC): ${n:-0}; force: ${FORCE:-false}"
          if [ "$FORCE" != "true" ] && [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  daily-update-and-retrain:
    needs: check-today
    if: needs.check-today.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Check out the odds archive (closing prices for CLV)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: odds-archive
          path: odds_archive

      - name: 🐍 Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Execute Master Pipeline with Automatic Retries (2 attempts)
        id: pipeline_execution
        uses: nick-fields/retry@v3
        env:
          # Optional providers: when a secret is unset the pipeline uses the free ESPN /
          # tennis-data.co.uk sources. There are no hardcoded fallback keys.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        with:
          timeout_minutes: 35
          max_attempts: 2
          retry_wait_seconds: 60
          command: python scripts/run_daily_pipeline.py

      - name: 💾 Commit & Push Updated Data, Ledgers & Trained Models
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Football/data/raw/ Football/data/cache/ Football/data/processed/ Football/models_saved/
          git add Tennis/data/raw/ Tennis/data/sackmann/ Tennis/data/tracker/ Tennis/data/upcoming/ Tennis/data/processed/ Tennis/models_saved/
          git add cache/ web/public/data/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): daily data sync, match reconciliation & model retraining [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully pushed updated models and verified ledgers to repository."
          else
            echo "ℹ️ No changes to commit. All datasets and model bundles are already up to date."
          fi

      # ==========================================
      # 🚨 AUTOMATED ALERTING ON PIPELINE FAILURE
      # ==========================================
      - name: 🚨 Create GitHub Issue Alert on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### 🚨 Daily Sports Pipeline Failed\n\n` +
              `- **Run ID**: [${context.runId}](${runUrl})\n` +
              `- **Trigger**: ${context.eventName}\n` +
              `- **Timestamp**: ${new Date().toISOString()}\n\n` +
              `The daily automated sync, reconciliation, or retraining pipeline failed after 2 attempts.\n\n` +
              `Please check the [execution logs](${runUrl}) for detailed error tracebacks.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [ALERT] Daily Pipeline Failure (${new Date().toISOString().slice(0, 10)})`,
              body: body,
              labels: ['pipeline-failure', 'bug']
            });

      - name: 📢 Dispatch Discord / Telegram Webhook Alert (Optional)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 *Sports Analytics Daily Pipeline FAILED* after 2 attempts on $(date -u +'%Y-%m-%d %H:%M UTC'). Check logs: $RUN_URL"
          
          # Send to Discord if webhook secret exists
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK" || true
          fi
          
          # Send to Telegram if token and chat ID secrets exist
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MSG" -d parse_mode="Markdown" || true
          fi

