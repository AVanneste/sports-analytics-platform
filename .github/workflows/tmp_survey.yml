name: TMP Pinnacle survey
on:
  push:
    branches: [feat/more-sports]
    paths: [scripts/tmp/survey_pinnacle.py]
jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install --no-deps -e . && pip install requests numpy
      - run: python scripts/tmp/survey_pinnacle.py
        env: {PINNACLE_KEY: "${{ secrets.PINNACLE_KEY }}"}
