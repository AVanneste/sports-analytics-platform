name: TMP edge dry run
on:
  push:
    branches: [feat/edge-score]
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: {ref: odds-archive, path: odds_archive}
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - run: pip install --no-deps -e . && pip install requests numpy pandas
      - run: |
          python - <<'PY'
          import json
          s = json.load(open("alerts_settings.json"))
          s.update(min_ev_pct=4.0, max_odds=2.25, books=["napoleon"], max_alerts_per_run=40)
          json.dump(s, open("/tmp/s.json", "w"))
          PY
          python scripts/odds_alerts.py --dry-run --settings /tmp/s.json --state /tmp/none.gz --edge-model odds_archive/edge_model.json 2>&1 | grep -E "candidates collected|Traceback|Error|^[⚽🎾🏀🏒🏐🤾]|expected edge|@ " | head -30
        env: {PINNACLE_KEY: "${{ secrets.PINNACLE_KEY }}"}
