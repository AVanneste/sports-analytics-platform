name: Alerts Weekly Report

# Mondays: how the past week's +EV alerts did against Pinnacle's closing price, to Telegram
# (scripts/alerts_report.py reads snapshots/alerts/ on the odds-archive branch); then retrains the
# expected-edge score on the last 60 days of closed alerts and publishes it if it validates.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: "Report on the last N days"
        default: "7"

permissions:
  contents: write  # publish edge_model.json to odds-archive

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 📦 Install (code only, plus requests and pandas)
        run: |
          pip install --no-deps -e .
          pip install requests pandas numpy

      - name: 📥 Check out the odds archive
        uses: actions/checkout@v5
        with:
          ref: odds-archive
          path: odds_archive

      - name: 🎯 Retrain the expected-edge score
        continue-on-error: true  # never blocks the report
        run: |
          python scripts/train_edge_score.py --archive odds_archive
          cd odds_archive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add edge_model.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -q -m "edge model $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull -q --rebase origin odds-archive && git push -q origin HEAD:odds-archive && exit 0
            sleep 5
          done
          exit 1

      - name: 📊 Send the report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alerts_report.py --days "${{ inputs.days || '7' }}" --telegram
