name: Daily Sports Data Sync, Auto-Reconciliation & Model Retraining

on:
  schedule:
    # Runs daily at 04:00 UTC (06:00 CEST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  daily-update-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Execute Master Sports Analytics Daily Pipeline
        run: |
          python scripts/run_daily_pipeline.py

      - name: 💾 Commit & Push Updated Data, Ledgers & Trained Models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Football/data/cache/ Football/data/processed/ Football/models_saved/
          git add Tennis/data/tracker/ Tennis/data/upcoming/ Tennis/data/processed/ Tennis/models_saved/
          git add cache/
          
          # Only commit if there are actual new data or model changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): daily data sync, match reconciliation & model retraining [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully pushed updated models and verified ledgers to repository."
          else
            echo "ℹ️ No changes to commit. All datasets and model bundles are already up to date."
          fi
