name: TMP new-sports dry run
on:
  push:
    branches: [feat/more-sports]
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install --no-deps -e . && pip install requests numpy pandas
      - run: |
          python - <<'PY'
          import json
          s = json.load(open("alerts_settings.json"))
          s.update(sports=["Hockey", "Volleyball", "Handball"], min_ev_pct=0.0, max_alerts_per_run=40)
          json.dump(s, open("/tmp/s.json", "w"))
          PY
          python scripts/odds_alerts.py --dry-run --settings /tmp/s.json --state /tmp/none.gz
        env: {PINNACLE_KEY: "${{ secrets.PINNACLE_KEY }}"}
