name: Daily Sports Data Sync, Auto-Reconciliation & Model Retraining

on:
  schedule:
    # Runs daily at 04:00 UTC (06:00 CEST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from the GitHub Actions tab

permissions:
  contents: write
  issues: write

jobs:
  daily-update-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Execute Master Pipeline with Automatic Retries (3 attempts)
        id: pipeline_execution
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          command: python scripts/run_daily_pipeline.py

      - name: 💾 Commit & Push Updated Data, Ledgers & Trained Models
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Football/data/cache/ Football/data/processed/ Football/models_saved/
          git add Tennis/data/tracker/ Tennis/data/upcoming/ Tennis/data/processed/ Tennis/models_saved/
          git add cache/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): daily data sync, match reconciliation & model retraining [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully pushed updated models and verified ledgers to repository."
          else
            echo "ℹ️ No changes to commit. All datasets and model bundles are already up to date."
          fi

      # ==========================================
      # 🚨 AUTOMATED ALERTING ON PIPELINE FAILURE
      # ==========================================
      - name: 🚨 Create GitHub Issue Alert on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### 🚨 Daily Sports Pipeline Failed\n\n` +
              `- **Run ID**: [${context.runId}](${runUrl})\n` +
              `- **Trigger**: ${context.eventName}\n` +
              `- **Timestamp**: ${new Date().toISOString()}\n\n` +
              `The daily automated sync, reconciliation, or retraining pipeline failed after 3 retry attempts.\n\n` +
              `Please check the [execution logs](${runUrl}) for detailed error tracebacks.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [ALERT] Daily Pipeline Failure (${new Date().toISOString().slice(0, 10)})`,
              body: body,
              labels: ['pipeline-failure', 'bug']
            });

      - name: 📢 Dispatch Discord / Telegram Webhook Alert (Optional)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 *Sports Analytics Daily Pipeline FAILED* after 3 retries on $(date -u +'%Y-%m-%d %H:%M UTC'). Check logs: $RUN_URL"
          
          # Send to Discord if webhook secret exists
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK" || true
          fi
          
          # Send to Telegram if token and chat ID secrets exist
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MSG" -d parse_mode="Markdown" || true
          fi
