name: Scout (weekly player scores)

# Refreshes web/public/data/scout.json, the Scout tab: FotMob season stats and squads for ~60
# leagues (~30 min), scores and profiles (scripts/update_scout.py). Raw FotMob tables stay out of
# git; the profile cache (foot, contract end) lives in the Actions cache between weeks.
on:
  schedule:
    - cron: '17 3 * * 1'  # Mondays, after the weekend's matches
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-weekly
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 📦 Install
        run: pip install -r requirements.txt

      - name: 🗂️ Restore profile cache
        uses: actions/cache/restore@v5
        with:
          path: Football/data/processed/scout/profiles.parquet
          key: scout-profiles-${{ github.run_id }}
          restore-keys: scout-profiles-

      - name: 🔭 Fetch, score and export
        run: python scripts/update_scout.py

      - name: 💾 Save profile cache
        uses: actions/cache/save@v5
        with:
          path: Football/data/processed/scout/profiles.parquet
          key: scout-profiles-${{ github.run_id }}

      - name: 📤 Commit the Scout payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/scout.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -q -m "chore(auto): weekly scout refresh [skip ci]"
          for attempt in 1 2 3; do
            git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep 10
          done
          exit 1
