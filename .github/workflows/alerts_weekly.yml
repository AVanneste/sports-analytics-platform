name: Alerts Weekly Report

# Mondays: how the past week's +EV alerts did against Pinnacle's closing price, to Telegram
# (scripts/alerts_report.py reads snapshots/alerts/ on the odds-archive branch).
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: "Report on the last N days"
        default: "7"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 📦 Install (code only, plus requests and pandas)
        run: |
          pip install --no-deps -e .
          pip install requests pandas numpy

      - name: 📊 Send the report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alerts_report.py --days "${{ inputs.days || '7' }}" --telegram
